# DSB — instancia de nginx DEDICADA (no toca /etc/nginx/nginx.conf ni la app que ya use el puerto 80).
# El instalador reemplaza @PORT@ y deja este archivo en /etc/dsb/nginx.conf
user nginx;
worker_processes 1;
pid /run/dsb-nginx.pid;
error_log /var/log/nginx/dsb-error.log;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types { application/javascript mjs; }
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/dsb-access.log main;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen @PORT@;
        listen [::]:@PORT@;
        server_name _;

        root /var/www/dsb;
        index index.html;

        # Estos archivos no deben quedar en caché: así una versión nueva se ve al recargar
        location = /index.html    { add_header Cache-Control "no-cache"; }
        location = /sw.js         { add_header Cache-Control "no-cache"; }
        location = /manifest.json { add_header Cache-Control "no-cache"; }
        location = /VERSION       { add_header Cache-Control "no-cache"; default_type text/plain; }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Servidor de usuarios, proyectos y versiones (servicio dsb-api, solo escucha en 127.0.0.1)
        location /api/ {
            client_max_body_size 150m;
            proxy_pass http://127.0.0.1:@API_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # se pisa (no se agrega) para que un cliente no pueda falsear su IP
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            add_header Cache-Control "no-store";
        }
    }
}
