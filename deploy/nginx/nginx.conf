# DSB — nginx mínimo para Rocky Linux 8 (reemplaza /etc/nginx/nginx.conf; el instalador hace backup)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    types { application/javascript mjs; }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/dsb;
        index index.html;

        # Archivos que NO deben quedar en caché (así una versión nueva se ve al recargar)
        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /sw.js      { add_header Cache-Control "no-cache"; }
        location = /manifest.json { add_header Cache-Control "no-cache"; }
        location = /VERSION    { add_header Cache-Control "no-cache"; default_type text/plain; }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reservado para el backend futuro (usuarios/proyectos)
        # location /api/ { proxy_pass http://127.0.0.1:3000/; }
    }
}
